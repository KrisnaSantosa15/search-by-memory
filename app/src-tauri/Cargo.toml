[package]
name = "sbm-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "sbm_app"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
sbm-change-usn = { path = "../../crates/change-usn" }
sbm-core = { path = "../../crates/core" }
sbm-embed-onnx = { path = "../../crates/embed-onnx" }
sbm-engine = { path = "../../crates/engine" }
sbm-index = { path = "../../crates/index" }
sbm-setup = { path = "../../crates/setup" }
sbm-thumbnail = { path = "../../crates/thumbnail" }
sbm-pdf = { path = "../../crates/pdf" }
base64 = "=0.22.1"
jiff = "=0.2.38"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-dialog = "=2.8.0"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.1"
