[package]
name = "sbm-embed-onnx"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sbm-core = { path = "../core" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
