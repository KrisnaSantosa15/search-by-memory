[package]
name = "sbm-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sbm-change-usn = { path = "../change-usn" }
sbm-core = { path = "../core" }
sbm-embed-onnx = { path = "../embed-onnx" }
sbm-engine = { path = "../engine" }
sbm-index = { path = "../index" }
sbm-store-usearch = { path = "../store-usearch" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"
