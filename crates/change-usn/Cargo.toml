[package]
name = "sbm-change-usn"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sbm-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "=3.27.0"
