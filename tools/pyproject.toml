[project]
name = "sbm-tools"
version = "0.1.0"
description = "Offline developer tooling for Search by Memory (never shipped; see ADR 0001)"
requires-python = ">=3.12"
dependencies = ["sentence-transformers[image]>=5", "torch", "torchvision"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
